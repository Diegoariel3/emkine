<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>404 · Página no encontrada — EM Movimiento, Salud y Bienestar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============ RESET & BASE ============ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", sans-serif;
        font-weight: 300;
        color: #2b2b2b;
        background: #faf7f2; /* Cream */
        line-height: 1.7;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        overflow-x: hidden;
      }

      /* ============ PALETTE ============ */
      :root {
        --cream: #faf7f2;
        --bone: #f2ede4;
        --beige: #e8dfd1;
        --sand: #d4c4a8;
        --dark: #1a1a1a;
        --charcoal: #2b2b2b;
        --silver: #b8b8b8;
        --silver-bright: #d8d8d8;
      }

      /* ============ TYPOGRAPHY ============ */
      .serif {
        font-family: "Playfair Display", serif;
      }

      /* ============ DIAMOND SEPARATOR ============ */
      .diamond-sep {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        margin: 2.5rem 0;
      }
      .diamond-sep::before,
      .diamond-sep::after {
        content: "";
        width: 60px;
        height: 1px;
        background: var(--silver);
      }
      .diamond-sep span {
        width: 8px;
        height: 8px;
        background: var(--silver);
        transform: rotate(45deg);
        display: inline-block;
      }

      /* ============ 404 CONTENT ============ */
      .error-code {
        font-family: "Playfair Display", serif;
        font-size: clamp(6rem, 15vw, 10rem);
        font-weight: 400;
        color: var(--beige);
        line-height: 1;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
        animation: fadeIn 1.5s ease;
      }

      .error-title {
        font-family: "Playfair Display", serif;
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        font-weight: 400;
        color: var(--charcoal);
        margin-bottom: 1.5rem;
        font-style: italic;
        animation: fadeUp 1.5s ease 0.3s both;
      }

      .error-text {
        max-width: 450px;
        color: #6b6b6b;
        font-size: 1.05rem;
        margin-bottom: 3rem;
        animation: fadeUp 1.5s ease 0.6s both;
      }

      /* ============ BUTTONS ============ */
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        animation: fadeUp 1.5s ease 0.9s both;
      }

      .btn-primary {
        display: inline-block;
        background: var(--charcoal);
        color: #fff;
        padding: 1rem 2.5rem;
        font-size: 0.8rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        font-weight: 300;
        transition: all 0.4s ease;
        border: 1px solid var(--charcoal);
        min-width: 280px;
      }
      .btn-primary:hover {
        background: transparent;
        color: var(--charcoal);
      }

      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        color: var(--charcoal);
        padding: 1rem 2.5rem;
        font-size: 0.8rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        font-weight: 300;
        transition: all 0.4s ease;
        border: 1px solid var(--silver);
        min-width: 280px;
      }
      .btn-secondary:hover {
        border-color: var(--charcoal);
        background: var(--bone);
      }
      .btn-secondary svg {
        width: 18px;
        height: 18px;
      }

      /* ============ ANIMATIONS ============ */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ============ RESPONSIVE ============ */
      @media (min-width: 600px) {
        .btn-group {
          flex-direction: row;
        }
      }
    </style>
  </head>
  <body>
    <div class="error-code">404</div>

    <h1 class="error-title">
      Parece que esta página se tomó un momento de pausa.
    </h1>

    <div class="diamond-sep"><span></span></div>

    <p class="error-text">
      No encontramos el espacio que estás buscando, pero tu bienestar sigue
      siendo nuestra prioridad. Volvé al inicio o contactanos directamente para
      reservar tu turno.
    </p>

    <div class="btn-group">
      <a href="/" class="btn-primary">Volver al inicio</a>

        class="btn-secondary"
        target="_blank"
      >

    </div>
  </body>
</html>
